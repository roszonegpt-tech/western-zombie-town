<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Dead Dust Gulch v4</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#2b1208;color:#ffe6ae;font-family:Arial,sans-serif;display:grid;place-items:center;text-align:center}
    .box{max-width:520px;padding:24px;border:2px solid #d8a85d;border-radius:18px;background:rgba(0,0,0,.35)}
  </style>
</head>
<body>
  <div class="box">Loading Dead Dust Gulch v4.0 largest-island sprite cleanup...</div>
  <script>
    (async()=>{
      let html=await fetch('index-v3.html?v4loader='+Date.now()).then(r=>r.text());
      html=html.replace(/<title>[^<]*<\/title>/,'<title>Dead Dust Gulch v4</title>');
      html=html.replaceAll('v3.1 bleed-clean','v4.0 largest-island');
      html=html.replaceAll('Sprite cleanup v3.1 active.','Sprite cleanup v4.0 largest-island active.');
      html=html.replaceAll('v3.1 cleanup active','v4.0 largest-island active');
      html=html.replace("const BUILD='v3.1';","const BUILD='v4.0';");

      const strictClean=`function clean(c){let ctx=c.getContext('2d'),w=c.width,h=c.height,id=ctx.getImageData(0,0,w,h),d=id.data,total=w*h,seen=new Uint8Array(total),q=[],best=[];const alpha=p=>d[p*4+3]>8;for(let s=0;s<total;s++){if(seen[s]||!alpha(s))continue;let arr=[];seen[s]=1;q=[s];while(q.length){let p=q.pop(),x=p%w,y=(p/w)|0;arr.push(p);let ns=[];if(x>0)ns.push(p-1);if(x<w-1)ns.push(p+1);if(y>0)ns.push(p-w);if(y<h-1)ns.push(p+w);for(const n of ns)if(!seen[n]&&alpha(n)){seen[n]=1;q.push(n)}}if(arr.length>best.length)best=arr}if(!best.length)return c;let keep=new Uint8Array(total);for(const p of best)keep[p]=1;for(let p=0;p<total;p++)if(!keep[p])d[p*4+3]=0;ctx.putImageData(id,0,0);return c}function trim(c){`;
      html=html.replace(/function clean\(c\)\{[\s\S]*?\}function trim\(c\)\{/,strictClean);
      document.open();
      document.write(html);
      document.close();
    })().catch(err=>{
      document.body.innerHTML='<div class="box"><h1>v4 failed to load</h1><p>'+String(err)+'</p></div>';
      console.error(err);
    });
  </script>
</body>
</html>
