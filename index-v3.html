 class="mb">RESET</button><button id="pause" class="mb">PAUSE</button></div></div><div id="msg">Loading...</div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>(()=>{const BUILD='v3.1';const $=id=>document.getElementById(id);const canvas=$('game'),hp=$('hp'),zc=$('zc'),sc=$('sc'),msg=$('msg'),panel=$('panel'),status=$('status'),rows=$('rows'),batch=$('batch'),pad=$('pad'),knob=$('knob'),shootBtn=$('shoot'),resetBtn=$('reset'),pauseBtn=$('pause');const states={cowboy:['idle','walk','shoot','hurt','die'],zombie:['idle','walk','hurt','die']};const cfg={cowboy:{idle:4,walk:8,shoot:10,hurt:10,die:8},zombie:{idle:4,walk:6,hurt:10,die:8}};const dirs={south:0,southWest:1,west:2,northWest:3,north:4,northEast:5,east:6,southEast:7};const expected={};for(const a in states)for(const s of states[a])expected[a+'_'+s]=[a,s];let sprites={cowboy:{},zombie:{}};const texCache=new WeakMap(),keys={},bullets=[],zombies=[];const world={missing:true,paused:false,score:0,spawn:0};const mobile={x:0,y:0,on:false,id:null};const player={pos:new THREE.Vector3(0,0,10),dir:new THREE.Vector3(0,0,1),aim:new THREE.Vector3(0,0,1),hp:100,walk:0,cool:0,action:'idle'};const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;const scene=new THREE.Scene();scene.background=new THREE.Color(0x8d4c31);scene.fog=new THREE.Fog(0x8d4c31,28,82);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);camera.position.set(0,32,32);scene.add(new THREE.HemisphereLight(0xffe0a0,0x3b1f16,1.4));const sun=new THREE.DirectionalLight(0xffd28a,1.8);sun.position.set(-18,32,16);sun.castShadow=true;scene.add(sun);function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.75}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}function age(sheet,col*fw,r*fh,fw,fh,0,0,fw,fh);row.push(trim(f))}frames.push(row)}return stable(frames)}async function loadState(a,s,src){let img=await loadImg(src),sheet=document.createElement('canvas');sheet.width=img.width;sheet.height=img.height;sheet.getContext('2d').drawImage(img,0,0);keyPink(sheet);sprites[a][s]={fps:cfg[a][s],frames:slice(sheet)}}async function autoLoad(){let miss=[];for(const a in states)for(const s of states[a])try{await loadState(a,s,`assets/sprites/${a}_${s}.png`)}catch(e){miss.push(a+'.'+s)}setStatus(miss)}function missing(){let m=[];for(const a in states)for(const s of states[a])if(!sprites[a][s])m.push(a+'.'+s);return m}function setStatus(m=missing()){world.missing=m.length>0;status.innerHTML=world.missing?'Missing: '+m.join(', '):'All sprite sheets loaded. v3.1 cleanup active.';msg.textContent=world.missing?'Missing sprites. Tap SPRITES.':'All real sprites loaded. Game running.'}function fileURL(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}function norm(n){return n.toLowerCase().replace(/\s+/g,'_').replace(/-/g,'_').replace(/\.(png|jpg|jpeg|webp)$/,'')}async function batchLoad(files){for(const f of Array.from(files)){let hit=expected[norm(f.name)];if(hit)await loadState(hit[0],hit[1],await fileURL(f))}setStatus()}function fr(a,s,dir,t){let sp=sprites[a]?.[s];if(!sp)return null;return sp.frames[dirs[dir]??0]?.[Math.floor(t)%6]}function tex(c){if(!c)return null;if(texCache.has(c))return texCache.get(c);let t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;texCache.set(c,t);return t}function apply(sp,c,h){if(!c){sp.visible=false;return}sp.material.map=tex(c);sp.material.transparent=true;sp.material.depthWrite=false;sp.material.needsUpdate=true;sp.visible=true;sp.scale.set(h*c.width/c.height,h,1)}function dir(v){let d=(Math.atan2(v.x,v.z)*180/Math.PI+360)%360;if(d>=337.5||d<22.5)return'south';if(d<67.5)return'southEast';if(d<112.5)return'east';if(d<157.5)return'northEast';if(d<202.5)return'north';if(d<247.5)return'northWest';if(d<292.5)return'west';return'southWest'}function spr(h){let s=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,depthWrite:false}));s.scale.set(h,h,1);scene.add(s);return s}function spawn(){let e=Math.floor(Math.random()*4),x,z;if(e===0){x=-30;z=-28+Math.random()*56}else if(e===1){x=30;z=-28+Math.random()*56}else if(e===2){x=-28+Math.random()*56;z=-30}else{x=-28+Math.random()*56;z=30}zombies.push({pos:new THREE.Vector3(x,0,z),hp:3,walk:Math.random()*10,hit:0,sprite:spr(1.85)})}function shoot(){if(world.missing||player.cool>0)return;player.cool=.24;bullets.push({pos:player.pos.clone().add(new THREE.Vector3(0,1.1,0)),vel:player.aim.clone().multiplyScalar(22),life:.9,mesh:box(.16,.16,.16,0xfff0a3,player.pos.x,1.1,player.pos.z)})}function reset(){world.score=0;player.hp=100;player.pos.set(0,0,10);for(const b of bullets)scene.remove(b.mesh);bullets.length=0;for(const z of zombies)scene.remove(z.sprite);zombies.length=0;for(let i=0;i<10;i++)spawn()}player.sprite=spr(2.05);town();reset();autoLoad();function update(dt){if(world.paused)return;if(!world.missing){let mv=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)mv.z-=1;if(keys.KeyS||keys.ArrowDown)mv.z+=1;if(keys.KeyA||keys.ArrowLeft)mv.x-=1;if(keys.KeyD||keys.ArrowRight)mv.x+=1;mv.x+=mobile.x;mv.z+=mobile.y;if(mv.lengthSq()){mv.normalize();player.pos.addScaledVector(mv,dt*7);player.dir.copy(mv);player.walk+=dt;player.action='walk'}else player.action='idle';if(keys.Space)shoot()}player.cool=Math.max(0,player.cool-dt);player.sprite.position.set(player.pos.x,1.05,player.pos.z);let ps=player.cool>0?'shoot':player.action;apply(player.sprite,fr('cowboy',ps,dir(ps==='shoot'?player.aim:player.dir),player.walk*(sprites.cowboy[ps]?.fps||8)),2.05);for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.life-=dt;b.pos.addScaledVector(b.vel,dt);b.mesh.position.copy(b.pos);if(b.life<=0){scene.remove(b.mesh);bullets.splice(i,1);continue}for(let j=zombies.length-1;j>=0;j--){let z=zombies[j];if(z.pos.distanceTo(b.pos)<.95){z.hp--;z.hit=.25;scene.remove(b.mesh);bullets.splice(i,1);if(z.hp<=0){world.score+=20;scene.remove(z.sprite);zombies.splice(j,1)}break}}}for(const z of zombies){let to=player.pos.clone().sub(z.pos),d=to.length();if(!world.missing&&d>.1){to.normalize();z.pos.addScaledVector(to,dt*2.2);z.walk+=dt}if(d<1.35)player.hp-=dt*18;z.hit=Math.max(0,z.hit-dt);z.sprite.position.set(z.pos.x,.92,z.pos.z);apply(z.sprite,fr('zombie',z.hit>0?'hurt':'walk',dir(player.pos.clone().sub(z.pos)),z.walk*(sprites.zombie.walk?.fps||6)),1.85)}world.spawn+=dt;if(!world.missing&&world.spawn>4&&zombies.length<12){world.spawn=0;spawn()}hp.textContent=Math.max(0,Math.round(player.hp));zc.textContent=zombies.length;sc.textContent=world.score;camera.position.lerp(new THREE.Vector3(player.pos.x,32,player.pos.z+32),.06);camera.lookAt(player.pos.x,0,player.pos.z)}let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}loop(last);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('pointermove',e=>{let ndc=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new THREE.Raycaster();ray.setFromCamera(ndc,camera);let hit=new THREE.Vector3();ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),hit);player.aim.copy(hit.sub(player.pos));if(player.aim.lengthSq())player.aim.normalize()});addEventListener('pointerdown',e=>{if(e.target===canvas)shoot()});$('spriteToggle').onclick=()=>panel.classList.toggle('open');batch.onchange=e=>batchLoad(e.target.files);for(const k in expected){let[a,s]=expected[k],r=document.crea
